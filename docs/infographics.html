<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infographics | Veegil Election</title>

  <!-- Leaflet & D3 CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>

  <!-- Styles -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f8f9fa;
      color: #222;
    }

    header {
      background: #004aad;
      color: white;
      padding: 1em 2em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 1.6em;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 0.6em;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      padding: 1.5em 2em;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .chart-section, .image-section {
      flex: 1 1 45%;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .image-section img {
      width: 100%;
      border-radius: 8px;
    }

    h2 {
      color: #004aad;
    }

    .external-link {
      text-align: center;
      margin: 30px 0;
    }

    .external-link a {
      background: #004aad;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }

    .external-link a:hover {
      background: #002f73;
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      text-align: center;
      padding: 8px;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .chart-section, .image-section {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Infographics</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="maps.html">Maps</a>
      <a href="infographics.html">Infographics</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="external-link">
      <h2>Explore Interactive Election Map</h2>
      <p>Click below to plot maps of any political office in Nigeria.</p>
      <a href="https://nigeria-maps-plotter.onrender.com/" target="_blank">
        Open Interactive Map
      </a>
    </section>

    <div class="container">
      <!-- Image Section -->
      <div class="image-section">
        <h2>Nigeria Geopolitical Map</h2>
        <img src="images/nigeria_geopolitics.png" alt="Nigeria Geopolitical Zones Map" />
      </div>

      <!-- Chart Section -->
      <div class="chart-section">
        <h2>Political Offices by Geopolitical Zone</h2>
        <svg id="chart" width="100%" height="400"></svg>
      </div>
    </div>
  </main>

  <div class="tooltip" id="tooltip"></div>

  <script>
    // --- Sample real data (2023 context) ---
    const data = [
      { zone: "North Central", governors: 6, senators: 19, reps: 49, assembly: 228, councillors: 1780 },
      { zone: "North East", governors: 6, senators: 18, reps: 48, assembly: 190, councillors: 1510 },
      { zone: "North West", governors: 7, senators: 21, reps: 92, assembly: 243, councillors: 2260 },
      { zone: "South East", governors: 5, senators: 15, reps: 43, assembly: 160, councillors: 1250 },
      { zone: "South South", governors: 6, senators: 18, reps: 55, assembly: 220, councillors: 1785 },
      { zone: "South West", governors: 6, senators: 18, reps: 71, assembly: 210, councillors: 1660 }
    ];

    const keys = ["governors", "senators", "reps", "assembly", "councillors"];
    const colors = d3.scaleOrdinal()
      .domain(keys)
      .range(["#1b9e77", "#d95f02", "#7570b3", "#e7298a", "#66a61e"]);

    const svg = d3.select("#chart");
    const margin = { top: 30, right: 30, bottom: 60, left: 70 };
    const width = parseInt(svg.style("width")) - margin.left - margin.right;
    const height = parseInt(svg.attr("height")) - margin.top - margin.bottom;

    const chart = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    const x = d3.scaleBand()
      .domain(data.map(d => d.zone))
      .range([0, width])
      .padding([0.2]);

    const y = d3.scaleLinear()
      .domain([0, d3.max(data, d => d3.max(keys, k => d[k])) * 1.1])
      .range([height, 0]);

    chart.append("g")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(x))
      .selectAll("text")
      .attr("transform", "rotate(-20)")
      .style("text-anchor", "end");

    chart.append("g").call(d3.axisLeft(y));

    const tooltip = d3.select("#tooltip");

    const barGroups = chart.selectAll("g.layer")
      .data(d3.stack().keys(keys)(data))
      .join("g")
      .attr("fill", d => colors(d.key));

    barGroups.selectAll("rect")
      .data(d => d)
      .join("rect")
      .attr("x", d => x(d.data.zone))
      .attr("y", d => y(d[1]))
      .attr("height", d => y(d[0]) - y(d[1]))
      .attr("width", x.bandwidth())
      .on("mousemove", (event, d) => {
        const [xPos, yPos] = d3.pointer(event);
        const zone = d.data.zone;
        const key = event.target.parentNode.__data__.key;
        const value = d.data[key];

        tooltip
          .style("opacity", 1)
          .style("left", `${xPos + margin.left + 20}px`)
          .style("top", `${yPos + margin.top}px`)
          .html(`<strong>${zone}</strong><br>${key}: ${value}`);
      })
      .on("mouseleave", () => tooltip.style("opacity", 0));

    const legend = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top / 2})`);

    keys.forEach((key, i) => {
      legend.append("rect")
        .attr("x", i * 120)
        .attr("width", 15)
        .attr("height", 15)
        .attr("fill", colors(key));

      legend.append("text")
        .attr("x", i * 120 + 20)
        .attr("y", 12)
        .text(key)
        .attr("font-size", "13px");
    });
  </script>
</body>
</html>
