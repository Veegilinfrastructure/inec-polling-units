<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nigeria Geopolitical Zones – D3 Choropleth</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    margin: 0;
    background: #f4f4f4;
  }
  h2 {
    text-align: center;
    margin-top: 20px;
  }
  .map-container {
    display: flex;
    justify-content: center;
  }
  svg {
    width: 90%;
    height: 700px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .tooltip {
    position: absolute;
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 13px;
    pointer-events: none;
  }
</style>
</head>
<body>
<h2>Nigeria – D3 Choropleth Map (by Geopolitical Zone)</h2>
<div class="map-container">
  <svg id="map"></svg>
</div>
<div class="tooltip" id="tooltip" style="opacity:0;"></div>

<script>
// ============ Configuration ============
const width = 900, height = 700;
const svg = d3.select("#map");
const tooltip = d3.select("#tooltip");

const projection = d3.geoMercator()
  .center([8.6753, 9.0820])  // Nigeria center
  .scale(3500)
  .translate([width/2, height/2]);

const path = d3.geoPath(projection);

// Zone color mapping
const zoneColor = {
  "North Central": "#8dd3c7",
  "North East": "#ffffb3",
  "North West": "#bebada",
  "South East": "#fb8072",
  "South South": "#80b1d3",
  "South West": "#fdb462"
};

// Zone data
const zoneData = {
  "North Central": { governors: 6, senators: 19, reps: 51, assembly: 200, councillors: 1320 },
  "North East":    { governors: 6, senators: 18, reps: 48, assembly: 180, councillors: 1300 },
  "North West":    { governors: 7, senators: 21, reps: 86, assembly: 216, councillors: 1600 },
  "South East":    { governors: 5, senators: 15, reps: 43, assembly: 150, councillors: 980 },
  "South South":   { governors: 6, senators: 18, reps: 55, assembly: 180, councillors: 1200 },
  "South West":    { governors: 6, senators: 18, reps: 71, assembly: 180, councillors: 1200 }
};

// State–Zone mapping
const stateToZone = {
  "Abia":"South East","Adamawa":"North East","Akwa Ibom":"South South","Anambra":"South East",
  "Bauchi":"North East","Bayelsa":"South South","Benue":"North Central","Borno":"North East",
  "Cross River":"South South","Delta":"South South","Ebonyi":"South East","Edo":"South South",
  "Ekiti":"South West","Enugu":"South East","FCT":"North Central","Gombe":"North East",
  "Imo":"South East","Jigawa":"North West","Kaduna":"North West","Kano":"North West",
  "Katsina":"North West","Kebbi":"North West","Kogi":"North Central","Kwara":"North Central",
  "Lagos":"South West","Nasarawa":"North Central","Niger":"North Central","Ogun":"South West",
  "Ondo":"South West","Osun":"South West","Oyo":"South West","Plateau":"North Central",
  "Rivers":"South South","Sokoto":"North West","Taraba":"North East","Yobe":"North East","Zamfara":"North West"
};

// ============ Load & Draw ============
d3.json("geojson/nigeria_states.topojson").then(data => {
  // find first object key dynamically
  const objectKey = Object.keys(data.objects)[0];
  const geojson = topojson.feature(data, data.objects[objectKey]);

  svg.selectAll("path")
    .data(geojson.features)
    .enter()
    .append("path")
    .attr("d", path)
    .attr("fill", d => {
      const zone = stateToZone[d.properties.admin1Name || d.properties.name];
      return zoneColor[zone] || "#ccc";
    })
    .attr("stroke", "#333")
    .attr("stroke-width", 0.5)
    .on("mouseover", (event, d) => {
      const state = d.properties.admin1Name || d.properties.name;
      const zone = stateToZone[state];
      const zdata = zoneData[zone];
      tooltip.transition().duration(200).style("opacity", 0.9);
      tooltip.html(`
        <strong>${state}</strong><br>
        Zone: ${zone}<br>
        Governors: ${zdata?.governors ?? "N/A"}<br>
        Senators: ${zdata?.senators ?? "N/A"}<br>
        Reps: ${zdata?.reps ?? "N/A"}<br>
        Assembly: ${zdata?.assembly ?? "N/A"}<br>
        Councillors: ${zdata?.councillors ?? "N/A"}
      `)
      .style("left", (event.pageX + 15) + "px")
      .style("top", (event.pageY - 30) + "px");
    })
    .on("mouseout", () => tooltip.transition().duration(300).style("opacity", 0));
});
</script>
</body>
</html>
